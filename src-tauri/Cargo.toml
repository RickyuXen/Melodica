[package]
name = "melodica"
version = "0.1.0"
description = "Local desktop music player with dual-language lyrics"
authors = ["you"]
edition = "2021"

[lib]
name = "melodica_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
